name: Probe sources

# Manual only. Reads public pages and reports what answers; changes no data and pushes nothing.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: probe_result.json
