<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>market-brief</title>
<meta name="description" content="Daily and weekly briefing on markets, world resources, regions, and climate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0b;
  --panel: #131315;
  --cell: #242428;
  --edge: #2a2a2e;
  --white: #f5f4ef;
  --dim: #8d8d93;
  --amber: #ffb000;
  --amber-dim: #8a6200;
  --paper: #f6f3ec;
  --ink: #1b1a17;
  --ink-dim: #6a665c;
  --rule: #d9d3c5;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--white); font: 400 13px/1.5 var(--mono); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

/* ---------- top: title, ticker, concourse tabs ---------- */
header.top { padding: 22px 0 10px; }
header.top h1 { margin: 0; font: 700 20px/1.2 var(--mono); letter-spacing: .04em; text-transform: uppercase; }
header.top h1 span { color: var(--amber); }
.stamp { margin: 6px 0 0; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.ticker { border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); background: var(--panel); overflow: hidden; white-space: nowrap; }
.ticker .track { display: inline-block; padding: 7px 0; animation: scroll 70s linear infinite; }
.ticker:hover .track { animation-play-state: paused; }
.ticker span { margin: 0 28px 0 0; text-transform: uppercase; letter-spacing: .04em; font-size: 12px; }
.ticker b { color: var(--amber); font-weight: 700; }
@keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--edge); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; padding-top: 8px; padding-bottom: 8px; scrollbar-width: thin; }
nav.tabs a { flex: none; text-decoration: none; color: var(--dim); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; padding: 4px 9px; border: 1px solid var(--edge); border-radius: 2px; }
nav.tabs a:hover { color: var(--white); border-color: var(--dim); }
nav.tabs a.on { color: #000; background: var(--amber); border-color: var(--amber); }

/* ---------- boards ---------- */
section.board { padding: 26px 0 6px; scroll-margin-top: 44px; }
.bh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 10px; background: var(--amber); color: #000; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 12.5px; }
.bh small { font-weight: 500; letter-spacing: .04em; font-size: 11px; }
.cols, .row { display: grid; grid-template-columns: 76px minmax(0, 1fr) 118px 84px 84px 84px 112px; column-gap: 10px; align-items: center; padding: 0 10px; }
.cols { padding-top: 7px; padding-bottom: 7px; background: var(--panel); border-bottom: 1px solid var(--edge); color: var(--amber); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.cols .r, .row .r { text-align: right; }
.rows { background: var(--panel); }
.sub { padding: 5px 10px; color: var(--amber); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; background: #0f0f10; border-bottom: 1px solid var(--edge); }
.row { min-height: 34px; border-bottom: 1px solid var(--edge); position: relative; }
.row.has { cursor: pointer; }
.row.has:hover { background: #18181b; }
.row .sym { font-weight: 700; letter-spacing: .04em; color: var(--white); overflow-wrap: anywhere; }
.row .nm { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
.row .moves { display: contents; }
.row .num { display: flex; justify-content: flex-end; }
.row .st { text-align: right; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.row .st.look { color: #000; background: var(--amber); font-weight: 700; padding: 2px 6px; justify-self: end; }
.row .st.eye { color: var(--amber); border: 1px solid var(--amber); padding: 1px 5px; justify-self: end; }
.row .st.grp { color: var(--amber); border: 1px dashed var(--amber-dim); padding: 1px 5px; justify-self: end; }
.row.look { box-shadow: inset 3px 0 0 var(--amber); }
.row.eye { box-shadow: inset 3px 0 0 var(--amber-dim); }

/* paging controls */
.pg { display: flex; align-items: center; gap: 6px; font-weight: 500; letter-spacing: .04em; }
.pg button { font: 700 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: #000; background: transparent; border: 1px solid #000; border-radius: 2px; padding: 4px 7px; cursor: pointer; }
.pg button:hover { background: #000; color: var(--amber); }
.pg button[aria-pressed="true"] { background: #000; color: var(--amber); }
.pg .pn { min-width: 8ch; text-align: right; font-size: 11px; }
.pbar { height: 2px; background: var(--edge); }
.pbar i { display: block; height: 100%; width: 0; background: var(--amber); }
.pbar i.run { animation: fill var(--dur, 8s) linear forwards; }
@keyframes fill { from { width: 0; } to { width: 100%; } }
[hidden] { display: none !important; }

/* alerts board and lede */
.lede { font: 400 16.5px/1.6 var(--serif); color: var(--white); margin: 22px 0 0; max-width: none; }
@media (min-width: 900px) { .lede { column-count: 2; column-gap: 40px; text-align: left; hyphens: auto; } }
.arow { display: grid; grid-template-columns: 112px 150px minmax(0, 1fr); column-gap: 10px; align-items: start; padding: 9px 10px; border-bottom: 1px solid var(--edge); cursor: pointer; }
.arow:hover { background: #18181b; }
.arow .sym { font-weight: 700; letter-spacing: .04em; overflow-wrap: anywhere; }
.arow .why { color: #d6d6d9; font-size: 12.5px; }
.arow .st { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; justify-self: start; }
.arow .st.look { color: #000; background: var(--amber); font-weight: 700; padding: 2px 6px; }
.arow .st.eye { color: var(--amber); border: 1px solid var(--amber); padding: 1px 5px; }
.arow.look { box-shadow: inset 3px 0 0 var(--amber); }
.arow.eye { box-shadow: inset 3px 0 0 var(--amber-dim); }
@media (max-width: 760px) { .arow { grid-template-columns: 1fr; row-gap: 3px; } }

/* split-flap characters */
.c { display: inline-block; width: 1.02ch; min-width: 1.02ch; height: 22px; line-height: 22px; margin-left: 1px; text-align: center; background: var(--cell); color: var(--white); font-weight: 500; position: relative; border-radius: 1.5px; }
.c::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.65); }
.c.sp { background: transparent; }
.c.sp::after { display: none; }
.c.amb { color: var(--amber); }
.c.flip { animation: flap .34s ease-out both; animation-delay: var(--d, 0ms); transform-origin: 50% 50%; }
@keyframes flap { 0% { transform: rotateX(90deg); opacity: .2; } 55% { transform: rotateX(-12deg); opacity: 1; } 100% { transform: rotateX(0); } }

/* expanded detail */
.det { display: none; padding: 10px 12px 12px 86px; background: #101012; border-bottom: 1px solid var(--edge); font-size: 12.5px; color: #cfcfd2; }
.det.open { display: block; }
.det p { margin: 0 0 5px; max-width: 86ch; }
.det .k { color: var(--amber); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; margin-right: 8px; }
.det a { text-decoration: underline; text-decoration-color: var(--amber-dim); text-underline-offset: 3px; }
.det a:hover { text-decoration-color: var(--amber); }
.det .bad { color: var(--amber); }

/* indicators board */
.icols, .irow { display: grid; grid-template-columns: minmax(0, 1.5fr) 128px 84px 112px 112px 126px; column-gap: 10px; align-items: center; padding: 0 10px; }
.icols { padding-top: 7px; padding-bottom: 7px; background: var(--panel); border-bottom: 1px solid var(--edge); color: var(--amber); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.irow { min-height: 40px; border-bottom: 1px solid var(--edge); cursor: pointer; }
.irow:hover { background: #18181b; }
.irow .nm2 { font-weight: 700; overflow-wrap: anywhere; }
.irow .nm2 small { display: block; color: var(--dim); font-weight: 400; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.irow svg { display: block; }
.irow svg polyline { fill: none; stroke: var(--white); stroke-width: 1.3; }
.irow svg circle { fill: var(--amber); }
.irow .when { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
.irow .stat { justify-self: end; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; color: var(--dim); }
.irow .stat.late { color: #000; background: var(--amber); font-weight: 700; padding: 2px 6px; }
.irow .stat.ok { color: var(--white); border: 1px solid var(--edge); padding: 1px 5px; }

/* ---------- paper section: prose ---------- */
.paper { background: var(--paper); color: var(--ink); margin-top: 40px; padding: 8px 0 80px; }
.paper h2 { font: 700 13px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; margin: 44px 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.paper .summary { font: 400 19px/1.55 var(--serif); max-width: 62ch; margin: 34px 0 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px 32px; }
.card { border-top: 1px solid var(--rule); padding-top: 10px; }
.card .meta { font: 500 11px/1.4 var(--mono); color: var(--ink-dim); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 4px; }
.card h3 { font: 600 17px/1.3 var(--serif); margin: 0 0 6px; }
.card h3 a { text-decoration-color: #b9b19c; text-underline-offset: 3px; }
.card p { font: 400 15px/1.55 var(--serif); margin: 0 0 6px; }
.card ul { list-style: none; margin: 4px 0 6px; padding: 0; font: 400 13.5px/1.45 var(--serif); }
.card li { margin: 0 0 4px; }
.card li .o { display: block; font: 500 11px/1.4 var(--mono); color: var(--ink-dim); text-transform: uppercase; letter-spacing: .04em; }
.card li.primary .o { color: var(--ink); }
.card a { text-decoration-color: #b9b19c; text-underline-offset: 3px; }
.card a:hover { text-decoration-color: var(--ink); }
.card .frame { font-style: italic; color: var(--ink-dim); }
.card .touch { font: 500 11.5px/1.5 var(--mono); color: var(--ink-dim); }
.tally { font: 400 13px/1.5 var(--mono); color: var(--ink-dim); margin: 0 0 14px; }
.fold { margin: 6px 0 0; font: 400 13px/1.5 var(--mono); }
.fold summary { cursor: pointer; color: var(--ink-dim); }
.fold ul { margin: 6px 0 8px; padding-left: 18px; }
.fold a { text-decoration-color: #b9b19c; text-underline-offset: 3px; }
.note { font: 400 12.5px/1.5 var(--mono); color: var(--ink-dim); margin: 36px 0 0; max-width: 80ch; }
.basis { color: var(--dim); font-size: 12px; margin: 12px 0 0; max-width: 90ch; }

/* ---------- phones ---------- */
@media (max-width: 760px) {
  .cols { display: none; }
  .row { grid-template-columns: 1fr auto; grid-template-areas: "sym last" "nm nm" "m m" "st st"; row-gap: 3px; padding: 8px 10px; }
  .row .sym { grid-area: sym; }
  .row .nm { grid-area: nm; }
  .row .n-last { grid-area: last; }
  .row .moves { grid-area: m; display: flex; gap: 10px; justify-content: flex-start; }
  .row .st { grid-area: st; justify-self: start !important; text-align: left; }
  .row .st:empty { display: none; }
  .det { padding-left: 12px; }
  .icols { display: none; }
  .irow { grid-template-columns: 1fr auto; grid-template-areas: "n n" "v y" "sp w" "s s"; row-gap: 4px; padding: 8px 10px; }
  .irow .nm2 { grid-area: n; } .irow .iv { grid-area: v; } .irow .iy { grid-area: y; justify-self: end; }
  .irow .isp { grid-area: sp; } .irow .when { grid-area: w; justify-self: end; } .irow .stat { grid-area: s; justify-self: start; }
  .bh small { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .ticker { white-space: normal; }
  .ticker .track { animation: none; }
  .ticker .dup { display: none; }
  .c.flip { animation: none; }
  .pbar i.run { animation: none; width: 0; }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>market<span>/</span>brief <span id="ed"></span></h1>
  <p class="stamp" id="stamp">loading</p>
</div></header>
<div class="ticker" id="ticker" aria-label="Flagged moves" hidden><div class="track" id="track"></div></div>
<nav class="tabs" id="tabs" aria-label="Boards"><div class="wrap" id="tabrow"></div></nav>
<main id="boards" class="wrap"></main>
<div class="paper"><div class="wrap" id="paper"></div></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function safeUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null; }
  function link(text, url) {
    var u = safeUrl(url);
    if (!u) return document.createTextNode(text);
    var a = el("a", null, text); a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer";
    return a;
  }
  function num(v) { return typeof v === "number" && isFinite(v); }
  function commas(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function fmtLast(v, sym) {
    if (!num(v)) return "—";
    var a = Math.abs(v);
    var s = a >= 10000 ? commas(a.toFixed(0)) : commas(a.toFixed(2));
    return (v < 0 ? "-" : "") + s + (sym === "^TNX" ? "%" : "");
  }
  function fmtChg(v, sym) {
    if (!num(v)) return "—";
    var s = Math.abs(v).toFixed(2) + (sym === "^TNX" ? "pp" : "%");
    if (v > 0) return "▲" + s;
    if (v < 0) return "▼" + s;
    return "·" + s;
  }
  function shortDate(s) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s || "")) return s || "";
    return s.slice(5).replace("-", "/");
  }

  /* ---------- split-flap text, subtle: only characters that changed since the last visit flip ---------- */
  var seen = {}, nextSeen = {};
  try { seen = JSON.parse(localStorage.getItem("board-seen") || "{}") || {}; } catch (e) { seen = {}; }
  var firstVisit = !Object.keys(seen).length;
  var flapCount = 0;

  function flap(container, key, text, amber) {
    var prev = seen[key];
    nextSeen[key] = text;
    var padTo = text.length;
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      var c = el("span", "c" + (ch === " " ? " sp" : "") + (amber ? " amb" : ""), ch === " " ? " " : ch);
      var changed = prev != null && prev.charAt(i) !== ch;
      if (!reduce && (changed || (firstVisit && flapCount < 120 && ch !== " "))) {
        c.className += " flip";
        c.style.setProperty("--d", Math.min(flapCount * 6, 700) + "ms");
        flapCount++;
      }
      container.appendChild(c);
    }
    container.setAttribute("aria-label", text);
  }
  function numCell(cls, key, text, amber) {
    var d = el("div", "num " + cls);
    var inner = el("span");
    inner.setAttribute("aria-hidden", "true");
    flap(inner, key, text, amber);
    d.setAttribute("aria-label", text);
    d.appendChild(inner);
    return d;
  }

  /* ---------- flag lookups ---------- */
  var flagBySym = {}, groupFlagBySym = {};
  function indexFlags(flags, cohorts) {
    var byId = {};
    Object.keys(cohorts || {}).forEach(function (k) { byId[k.toUpperCase().replace(/_/g, " ")] = cohorts[k].symbols || []; });
    (flags || []).forEach(function (f) {
      if (byId[f.symbol]) byId[f.symbol].forEach(function (m) { if (!groupFlagBySym[m]) groupFlagBySym[m] = f; });
      else flagBySym[f.symbol] = f;
    });
  }

  function addDetail(parent, f, item) {
    var det = el("div", "det");
    if (f) {
      var p = el("p"); p.appendChild(el("span", "k", f.tier === "look_into" ? "look into" : "keep an eye on")); p.appendChild(document.createTextNode(f.reason || "")); det.appendChild(p);
      if (f.verified && f.verified.text) { var v = el("p"); v.appendChild(el("span", "k", "check")); v.appendChild(el("span", f.verified.status === "differ" ? "bad" : null, f.verified.text)); det.appendChild(v); }
      (f.news || []).forEach(function (n) { var q = el("p"); q.appendChild(el("span", "k", n.kind === "headline" ? "news" : "reading")); q.appendChild(link(n.title || n.url, n.url)); if (n.strength === "loose") q.appendChild(document.createTextNode(" (loose link)")); det.appendChild(q); });
      (f.context || []).forEach(function (c) { var q = el("p"); q.appendChild(el("span", "k", "indicator")); q.appendChild(document.createTextNode(c.name + " (" + c.period + "): " + (c.yoy >= 0 ? "+" : "") + c.yoy + "% year on year")); det.appendChild(q); });
    }
    if (item.note) { var n = el("p"); n.appendChild(el("span", "k", "note")); n.appendChild(document.createTextNode(item.note)); det.appendChild(n); }
    var bits = [];
    if (item.src) bits.push(item.src + (item.tier ? " (" + item.tier + ")" : ""));
    if (item.xcheck && item.xcheck.src) bits.push("second source: " + item.xcheck.src + ", " + (item.xcheck.status || "unchecked"));
    if (item.as_of) bits.push("as of " + item.as_of);
    if (item.next_earnings) bits.push("next earnings " + item.next_earnings);
    if (item.esg) bits.push("ESG: " + (typeof item.esg === "string" ? item.esg : JSON.stringify(item.esg)));
    if (bits.length) { var s = el("p"); s.appendChild(el("span", "k", "source")); s.appendChild(document.createTextNode(bits.join(" · "))); det.appendChild(s); }
    parent.appendChild(det);
    return det;
  }

  function daysUntil(iso, base) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || "")) return null;
    return Math.round((Date.parse(iso + "T00:00:00Z") - Date.parse(base + "T00:00:00Z")) / 86400000);
  }

  function boardRow(item, d) {
    var frag = document.createDocumentFragment();
    var gf = groupFlagBySym[item.symbol], f = flagBySym[item.symbol] || null;
    var st = "", stc = "st";
    if (f) { st = f.tier === "look_into" ? "look into" : "watch"; stc += f.tier === "look_into" ? " look" : " eye"; }
    else if (gf) { st = "group move"; stc += " grp"; }
    else {
      var du = daysUntil(item.next_earnings, d.data_date);
      if (du != null && du >= 0 && du <= 14) st = "earn " + shortDate(item.next_earnings);
    }
    var hasDet = !!(f || gf || item.note || item.src || item.next_earnings || item.esg);
    var row = el("div", "row" + (f ? (f.tier === "look_into" ? " look" : " eye") : "") + (hasDet ? " has" : ""));
    if (hasDet) { row.tabIndex = 0; row.setAttribute("role", "button"); row.setAttribute("aria-expanded", "false"); }
    row.appendChild(el("div", "sym", item.symbol));
    row.appendChild(el("div", "nm", item.name || ""));
    row.appendChild(numCell("n-last", item.symbol + ":l", fmtLast(item.last, item.symbol), false));
    var moves = el("div", "moves");
    ["chg_1d", "chg_1w", "chg_1m"].forEach(function (k) {
      var big = num(item[k]) && Math.abs(item[k]) >= 5;
      moves.appendChild(numCell("r", item.symbol + ":" + k, fmtChg(item[k], item.symbol), big));
    });
    /* on wide screens the three move columns are direct grid children */
    row.appendChild(moves);
    row.appendChild(el("div", stc, st));
    frag.appendChild(row);
    if (hasDet) {
      var det = addDetail(frag, f || gf, item);
      var toggle = function () { var o = det.classList.toggle("open"); row.setAttribute("aria-expanded", o ? "true" : "false"); };
      row.addEventListener("click", function (e) { if (e.target.tagName !== "A") toggle(); });
      row.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    }
    return frag;
  }

  function renderAlerts(flags) {
    if (!flags || !flags.length) return null;
    var s = el("section", "board"); s.id = "alerts";
    var h = el("div", "bh"); h.appendChild(el("span", null, "Alerts: worth a look"));
    h.appendChild(el("small", null, flags.length + (flags.length === 1 ? " move" : " moves")));
    s.appendChild(h);
    var box = el("div", "rows"); s.appendChild(box);
    flags.forEach(function (f) {
      var look = f.tier === "look_into";
      var r = el("div", "arow " + (look ? "look" : "eye")); r.tabIndex = 0; r.setAttribute("role", "button"); r.setAttribute("aria-expanded", "false");
      r.appendChild(el("div", "st " + (look ? "look" : "eye"), look ? "look into" : "keep an eye on"));
      r.appendChild(el("div", "sym", f.symbol));
      r.appendChild(el("div", "why", f.reason || ""));
      box.appendChild(r);
      var det = addDetail(box, f, {});
      var tg = function () { var o = det.classList.toggle("open"); r.setAttribute("aria-expanded", o ? "true" : "false"); };
      r.addEventListener("click", function (e) { if (e.target.tagName !== "A") tg(); });
      r.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tg(); } });
    });
