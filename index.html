<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#443a4f">
<title>market-brief</title>
<meta name="description" content="Daily and weekly briefing on markets, world resources, regions, and climate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:wght@400;500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #443a4f; --panel: #1a1620; --cell: #272030; --edge: #2d2536; --white: #dcd3e3; --dim: #9d91aa;
  --accent: #f2b8d2; --accent-dim: #9a6a82; --ok: #5fd6a0; --ok-edge: #1f5a3a;
  --paper: #ddd5e2; --ink: #261f2d; --ink-dim: #5b4f68; --rule: #bdb1c8; --on-accent: #2a0f1c;
  --mono: "Red Hat Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --hover: #211b29; --sunk: #130f18; --detbg: #15111b; --det-text: #c6bbd0; --why-text: #dcd3e3; --paper-link: #a396b0;
  /* page ground (header, ticker, tabs, summary) */
  --g-bg: #443a4f; --g-text: #ece6f0; --g-dim: #bdb1c8; --g-edge: #5a4e68; --g-ticker: #3a3144;
  --g-accent: var(--accent); --g-accent-dim: var(--accent-dim); --on-g-accent: var(--on-accent);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--g-bg); color: var(--g-text); font: 400 13px/1.5 var(--mono); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--g-accent); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

/* ---------- top: title, ticker, concourse tabs ---------- */
header.top { padding: 22px 0 10px; }
header.top h1 { margin: 0; font: 700 20px/1.2 var(--mono); letter-spacing: .04em; text-transform: uppercase; }
header.top h1 span { color: var(--g-accent); }
.stamp { margin: 6px 0 0; color: var(--g-dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.ticker { border-top: 1px solid var(--g-edge); border-bottom: 1px solid var(--g-edge); background: var(--g-ticker); overflow: hidden; white-space: nowrap; }
.ticker .track { display: inline-block; padding: 7px 0; animation: scroll 70s linear infinite; }
.ticker:hover .track { animation-play-state: paused; }
.ticker span { margin: 0 28px 0 0; text-transform: uppercase; letter-spacing: .04em; font-size: 12px; }
.ticker b { color: var(--g-accent); font-weight: 700; }
@keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--g-bg); border-bottom: 1px solid var(--g-edge); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; padding-top: 8px; padding-bottom: 8px; scrollbar-width: thin; }
nav.tabs a { flex: none; text-decoration: none; color: var(--g-dim); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; padding: 4px 9px; border: 1px solid var(--g-edge); border-radius: 2px; }
nav.tabs a:hover { color: var(--g-text); border-color: var(--g-dim); }
nav.tabs .wrap.sub { padding-top: 0; }
nav.tabs .wrap.sub:empty { display: none; }
nav.tabs .wrap.sub a { font-size: 10.5px; border-style: dashed; padding: 3px 8px; }
nav.tabs .wrap.sub a.on { border-style: solid; }
.find { margin: 16px 0 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.find input { flex: 1 1 260px; max-width: 440px; font: 400 13px/1 var(--mono); color: var(--g-text); background: var(--g-ticker); border: 1px solid var(--g-edge); border-radius: 2px; padding: 10px 11px; }
.find input::placeholder { color: var(--g-dim); }
.find .tally { color: var(--g-dim); font-size: 12px; }
.row .st.old { color: var(--dim); font-style: italic; }
.newtag { margin-left: 8px; padding: 1px 5px; font: 700 10.5px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--paper); background: var(--ink); }
nav.tabs a.on { color: var(--on-g-accent); background: var(--g-accent); border-color: var(--g-accent); }

/* ---------- boards ---------- */
section.board { padding: 26px 0 6px; scroll-margin-top: 84px; color: var(--white); }
.bh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 10px; background: var(--accent); color: var(--on-accent); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 12.5px; }
.bh small { font-weight: 500; letter-spacing: .04em; font-size: 11px; }
.cols, .row { display: grid; grid-template-columns: 76px minmax(0, 1fr) 118px 84px 84px 84px 112px; column-gap: 10px; align-items: center; padding: 0 10px; }
.cols { padding-top: 7px; padding-bottom: 7px; background: var(--panel); border-bottom: 1px solid var(--edge); color: var(--accent); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.cols .r, .row .r { text-align: right; }
.rows { background: var(--panel); }
.sub { padding: 5px 10px; color: var(--accent); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; background: var(--sunk); border-bottom: 1px solid var(--edge); }
.row { min-height: 34px; border-bottom: 1px solid var(--edge); position: relative; }
.row.has { cursor: pointer; }
.row.has:hover { background: var(--hover); }
.row .sym { font-weight: 700; letter-spacing: .04em; color: var(--white); overflow-wrap: anywhere; }
.row .nm { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
.row .moves { display: contents; }
.row .num { display: flex; justify-content: flex-end; }
.row .st { text-align: right; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.row .st.look { color: var(--on-accent); background: var(--accent); font-weight: 700; padding: 2px 6px; justify-self: end; }
.row .st.eye { color: var(--accent); border: 1px solid var(--accent); padding: 1px 5px; justify-self: end; }
.row .st.grp { color: var(--accent); border: 1px dashed var(--accent-dim); padding: 1px 5px; justify-self: end; }
.row.look { box-shadow: inset 3px 0 0 var(--accent); }
.row.eye { box-shadow: inset 3px 0 0 var(--accent-dim); }

/* paging controls */
.pg { display: flex; align-items: center; gap: 6px; font-weight: 500; letter-spacing: .04em; }
.pg button { font: 700 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--on-accent); background: transparent; border: 1px solid var(--on-accent); border-radius: 2px; padding: 4px 7px; cursor: pointer; }
.pg button:hover { background: var(--on-accent); color: var(--accent); }
.pg button[aria-pressed="true"] { background: var(--on-accent); color: var(--accent); }
.pg .pn { min-width: 8ch; text-align: right; font-size: 11px; }
.pbar { height: 2px; background: var(--edge); }
.pbar i { display: block; height: 100%; width: 0; background: var(--accent); }
.pbar i.run { animation: fill var(--dur, 8s) linear forwards; }
@keyframes fill { from { width: 0; } to { width: 100%; } }
[hidden] { display: none !important; }

/* alerts board and lede */
.lede { font: 400 16.5px/1.6 var(--serif); color: var(--g-text); margin: 22px 0 0; max-width: none; }
@media (min-width: 900px) { .lede { column-count: 2; column-gap: 40px; text-align: left; hyphens: auto; } }
.arow { display: grid; grid-template-columns: 112px 150px minmax(0, 1fr); column-gap: 10px; align-items: start; padding: 9px 10px; border-bottom: 1px solid var(--edge); cursor: pointer; }
.arow:hover { background: var(--hover); }
.arow .sym { font-weight: 700; letter-spacing: .04em; overflow-wrap: anywhere; }
.arow .why { color: var(--why-text); font-size: 12.5px; }
.arow .st { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; justify-self: start; }
.arow .st.look { color: var(--on-accent); background: var(--accent); font-weight: 700; padding: 2px 6px; }
.arow .st.eye { color: var(--accent); border: 1px solid var(--accent); padding: 1px 5px; }
.arow.look { box-shadow: inset 3px 0 0 var(--accent); }
.arow.eye { box-shadow: inset 3px 0 0 var(--accent-dim); }
@media (max-width: 760px) { .arow { grid-template-columns: 1fr; row-gap: 3px; } }

/* split-flap characters */
.c { display: inline-block; width: 1.02ch; min-width: 1.02ch; height: 22px; line-height: 22px; margin-left: 1px; text-align: center; background: var(--cell); color: var(--white); font-weight: 500; position: relative; border-radius: 1.5px; }
.c::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.7); }
.c.sp { background: transparent; }
.c.sp::after { display: none; }
.c.amb { color: var(--accent); }
.c.flip { animation: flap .34s ease-out both; animation-delay: var(--d, 0ms); transform-origin: 50% 50%; }
@keyframes flap { 0% { transform: rotateX(90deg); opacity: .2; } 55% { transform: rotateX(-12deg); opacity: 1; } 100% { transform: rotateX(0); } }

/* expanded detail */
.det { display: none; padding: 10px 12px 12px 86px; background: var(--detbg); border-bottom: 1px solid var(--edge); font-size: 12.5px; color: var(--det-text); }
.det.open { display: block; }
.det p { margin: 0 0 5px; max-width: 86ch; }
.det .k { color: var(--accent); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; margin-right: 8px; }
.det a { text-decoration: underline; text-decoration-color: var(--accent-dim); text-underline-offset: 3px; }
.det a:hover { text-decoration-color: var(--accent); }
.det .bad { color: var(--accent); font-weight: 700; }
.det .good { color: var(--ok); }

/* indicators board */
.icols, .irow { display: grid; grid-template-columns: minmax(0, 1.5fr) 128px 84px 112px 112px 126px; column-gap: 10px; align-items: center; padding: 0 10px; }
.icols { padding-top: 7px; padding-bottom: 7px; background: var(--panel); border-bottom: 1px solid var(--edge); color: var(--accent); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.irow { min-height: 40px; border-bottom: 1px solid var(--edge); cursor: pointer; }
.irow:hover { background: var(--hover); }
.irow .nm2 { font-weight: 700; overflow-wrap: anywhere; }
.irow .nm2 small { display: block; color: var(--dim); font-weight: 400; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.irow svg { display: block; }
.irow svg polyline { fill: none; stroke: var(--white); stroke-width: 1.3; }
.irow svg circle { fill: var(--accent); }
.irow .when { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
.irow .stat { justify-self: end; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; color: var(--dim); }
.irow .stat.late { color: var(--on-accent); background: var(--accent); font-weight: 700; padding: 2px 6px; }
.irow .stat.ok { color: var(--ok); border: 1px solid var(--ok-edge); padding: 1px 5px; }

/* ---------- paper section: prose ---------- */
.paper { background: var(--paper); color: var(--ink); margin-top: 40px; padding: 8px 0 80px; }
.paper h2 { font: 700 13px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; margin: 44px 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.paper .summary { font: 400 19px/1.55 var(--serif); max-width: 62ch; margin: 34px 0 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px 32px; }
.card { border-top: 1px solid var(--rule); padding-top: 10px; }
.card .meta { font: 500 11px/1.4 var(--mono); color: var(--ink-dim); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 4px; }
.card h3 { font: 600 17px/1.3 var(--serif); margin: 0 0 6px; }
.card h3 a { text-decoration-color: var(--paper-link); text-underline-offset: 3px; }
.card p { font: 400 15px/1.55 var(--serif); margin: 0 0 6px; }
.card ul { list-style: none; margin: 4px 0 6px; padding: 0; font: 400 13.5px/1.45 var(--serif); }
.card li { margin: 0 0 4px; }
.card li .o { display: block; font: 500 11px/1.4 var(--mono); color: var(--ink-dim); text-transform: uppercase; letter-spacing: .04em; }
.card li.primary .o { color: var(--ink); }
.card a { text-decoration-color: var(--paper-link); text-underline-offset: 3px; }
.card a:hover { text-decoration-color: var(--ink); }
.card .frame { font-style: italic; color: var(--ink-dim); }
.card .touch { font: 500 11.5px/1.5 var(--mono); color: var(--ink-dim); }
.tally { font: 400 13px/1.5 var(--mono); color: var(--ink-dim); margin: 0 0 14px; }
.btog, .bpre, .ball, .rtog { display: none; }
.rchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.rchips button { font: 400 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-dim); background: transparent; border: 1px solid var(--rule); border-radius: 2px; padding: 6px 10px; cursor: pointer; }
.rchips button:hover { color: var(--ink); border-color: var(--ink-dim); }
.rchips button.on { color: var(--paper); background: var(--ink); border-color: var(--ink); }
.cards > [hidden] { display: none; }
.fold { margin: 6px 0 0; font: 400 13px/1.5 var(--mono); }
.fold summary { cursor: pointer; color: var(--ink-dim); }
.fold ul { margin: 6px 0 8px; padding-left: 18px; }
.fold a { text-decoration-color: var(--paper-link); text-underline-offset: 3px; }
.note { font: 400 12.5px/1.5 var(--mono); color: var(--ink-dim); margin: 36px 0 0; max-width: 80ch; }
.basis { color: var(--g-dim); font-size: 12px; margin: 12px 0 0; max-width: 90ch; }

/* route line: regions as stops on a dotted line, following the sun */
.rline { background: var(--panel); border: 1px solid var(--edge); padding: 12px 10px 14px; margin-bottom: 14px; }
.rl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; color: var(--accent); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 12px; }
.rl-head small { color: var(--dim); font-size: 11px; letter-spacing: .03em; text-transform: none; }
.rl-stops { list-style: none; margin: 0; padding: 0; display: flex; }
.rl-stops li { flex: 1 1 0; min-width: 0; position: relative; }
.rl-stops li + li::before { content: ""; position: absolute; top: 6px; left: -50%; right: 50%; border-top: 2px dotted var(--accent-dim); }
.rl-stops li.off::before { border-top-style: dashed; opacity: .45; }
.stop { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; padding: 0 2px 4px; background: none; border: 0; color: var(--dim); font: 400 11px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .06em; cursor: pointer; position: relative; z-index: 1; text-align: center; }
.stop:hover { color: var(--white); }
.stop .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); background: var(--panel); }
.stop:hover .dot { background: var(--accent-dim); }
.stop.on { color: var(--white); }
.stop.on .dot { background: var(--accent); box-shadow: 0 0 0 3px var(--panel), 0 0 0 4px var(--accent); }
.rl-stops li.off .dot { border-style: dashed; border-color: var(--accent-dim); }
.stop .mv { min-height: 22px; display: flex; align-items: center; }
.stop .mv .none { color: var(--edge); font-size: 11px; }
.stop .mv .c { height: 20px; line-height: 20px; font-size: 11px; }
.stop .fl { min-height: 16px; font-size: 10.5px; color: var(--accent); }
.stop .fl:not(:empty) { border: 1px dashed var(--accent-dim); padding: 0 5px; }
.rpill { position: fixed; left: 16px; bottom: 16px; z-index: 8; display: flex; align-items: center; gap: 10px; background: var(--accent); color: var(--on-accent); font: 700 11.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 8px 10px; border-radius: 2px; box-shadow: 0 2px 10px rgba(0,0,0,.45); }
.rpill button { font: 700 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; background: transparent; color: var(--on-accent); border: 1px solid var(--on-accent); border-radius: 2px; padding: 3px 6px; cursor: pointer; }
.rpill button:hover { background: var(--on-accent); color: var(--accent); }
.sub.empty { color: var(--dim); text-transform: none; letter-spacing: .02em; }
.card li.off { opacity: .5; }
.card li.hit .o { color: var(--ink); font-weight: 700; }
.card li.hit { border-left: 2px solid var(--ink); padding-left: 8px; margin-left: -10px; }
@media (max-width: 760px) {
  .rl-head small { display: none; }
  .rl-stops { flex-direction: column; padding-left: 2px; }
  .rl-stops li + li::before { top: -50%; bottom: 50%; left: 8px; right: auto; border-top: 0; border-left: 2px dotted var(--accent-dim); height: auto; }
  .rl-stops li.off::before { border-left-style: dashed; }
  .stop { flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; padding: 7px 0; text-align: left; }
  .stop .nm { flex: 1; }
  .stop .mv { min-height: 0; order: 3; }
  .stop .fl { order: 4; min-height: 0; }
}

/* ---------- phones ---------- */
@media (max-width: 760px) {
  .cols { display: none; }
  .row { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "sym nm last" "m m st"; row-gap: 4px; column-gap: 10px; padding: 7px 10px; min-height: 0; }
  .row .sym { grid-area: sym; }
  .row .nm { grid-area: nm; }
  .row .n-last { grid-area: last; }
  .row .moves { grid-area: m; display: flex; gap: 6px; justify-content: flex-start; }
  .row .st { grid-area: st; justify-self: end !important; text-align: right; }
  .row .st:empty { display: none; }
  .row .moves .num { justify-content: flex-start; }
  .det { padding-left: 12px; }
  .icols { display: none; }
  .irow { grid-template-columns: 1fr auto; grid-template-areas: "n n" "v y" "sp w" "s s"; row-gap: 4px; padding: 8px 10px; }
  .irow .nm2 { grid-area: n; } .irow .iv { grid-area: v; } .irow .iy { grid-area: y; justify-self: end; }
  .irow .isp { grid-area: sp; } .irow .when { grid-area: w; justify-self: end; } .irow .stat { grid-area: s; justify-self: start; }
  .bh small { display: none; }

  /* phones: boards collapse to a header and one preview line; Reading becomes a compact list of links */
  section.board { padding-top: 14px; }
  .bh { flex-wrap: wrap; cursor: pointer; gap: 6px 8px; }
  .bh > span:first-child { flex: 1; min-width: 0; }
  .bh > span:first-child::before { content: "\25BE\00a0"; }
  section.board.collapsed .bh > span:first-child::before { content: "\25B8\00a0"; }
  .btog { display: inline-block; order: 2; font: 700 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--on-accent); background: transparent; border: 1px solid var(--on-accent); border-radius: 2px; padding: 4px 7px; cursor: pointer; }
  .btog:hover { background: var(--on-accent); color: var(--accent); }
  .bh .pg { order: 3; width: 100%; justify-content: space-between; cursor: default; }
  .bpre { display: none; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--edge); color: var(--dim); font-size: 12px; letter-spacing: .02em; }
  section.board.collapsed .bpre { display: block; }
  section.board.collapsed > :not(.bh):not(.bpre):not(.rline) { display: none !important; }
  section.board.collapsed .pg { display: none; }
  .ball { display: block; margin: 18px 0 -8px auto; font: 700 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--g-accent); background: transparent; border: 1px solid var(--g-accent-dim); border-radius: 2px; padding: 7px 9px; cursor: pointer; }
  .cards.rdlist { gap: 0; }
  .card.rd { position: relative; padding: 9px 0 8px; }
  .card.rd .meta { margin-bottom: 2px; padding-right: 36px; cursor: pointer; }
  .card.rd h3 { font-size: 15.5px; margin: 0 36px 2px 0; }
  .card.rd > p:not(.meta) { display: none; }
  .card.rd.open > p:not(.meta) { display: block; }
  .rtog { display: block; position: absolute; right: 0; top: 4px; width: 32px; height: 32px; font: 500 18px/1 var(--mono); color: var(--ink-dim); background: transparent; border: 1px solid var(--rule); border-radius: 2px; cursor: pointer; }
  .rchips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -16px; padding-right: 16px; }
  .rchips button { flex: none; white-space: nowrap; }
}

@media (prefers-reduced-motion: reduce) {
  .ticker { white-space: normal; }
  .ticker .track { animation: none; }
  .ticker .dup { display: none; }
  .c.flip { animation: none; }
  .pbar i.run { animation: none; width: 0; }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>market<span>/</span>brief <span id="ed"></span></h1>
  <p class="stamp" id="stamp">loading</p>
</div></header>
<div class="ticker" id="ticker" aria-label="Flagged moves" hidden><div class="track" id="track"></div></div>
<nav class="tabs" id="tabs" aria-label="Boards"><div class="wrap" id="tabrow"></div><div class="wrap sub" id="tabsub"></div></nav>
<main id="boards" class="wrap"></main>
<div class="paper"><div class="wrap" id="paper"></div></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function el(tag, cls, text) {

        s.appendChild(document.createTextNode((f.reason || "").replace(/\s*\(about [^)]*\)/, "").split(";")[0]));
        wrap.appendChild(s);
      });
      return wrap;
    }
    t.appendChild(pass("")); t.appendChild(pass("dup"));
    $("ticker").hidden = false;
  }

  function init(d, w) {
    var ed = d.edition === "saturday" ? "saturday review" : "daily";
    $("ed").textContent = ed;
    $("stamp").textContent = "market data as of " + d.data_date + " · published " + (d.generated_at || "").replace("T", " ").replace(/:\d\d Z?$/, " UTC");
    renderTicker(d.flags);
    buildRelated(d);
    indexFlags(d.flags, w && w.flagging && w.flagging.peer_cohorts);
    var boards = $("boards"), tabs = $("tabrow");
    var order = [];
    if (d.summary) boards.appendChild(el("p", "lede", d.summary));
    var find = el("div", "find"), qin = el("input"), tally = el("span", "tally");
    qin.type = "search"; qin.placeholder = "Find a symbol or name"; qin.setAttribute("aria-label", "Find a symbol or name across every board");
    qin.addEventListener("input", function () {
      fstate.qraw = qin.value.trim(); fstate.q = fstate.qraw.toLowerCase();
      var n = applyBoardFilters();
      tally.textContent = fstate.q ? (n ? n + (n === 1 ? " match" : " matches") + " across the boards" : "No match") : "";
    });
    find.appendChild(qin); find.appendChild(tally); boards.appendChild(find);
    var al = renderAlerts(d.flags);
    if (al) { boards.appendChild(al); order.push(["alerts", "Alerts"]); }
    if (d.flag_basis && d.flag_basis.note) boards.appendChild(el("p", "basis", d.flag_basis.note + (d.flag_basis.below_the_bar ? " " + d.flag_basis.below_the_bar + " other unusual moves fell under the bar." : "")));
    var mv = renderMovers(d, w);
    if (mv) { boards.appendChild(mv); order.push(["movers", "Movers"]); }
    var routed = false;
    (d.groups || []).forEach(function (g) {
      var sec = renderBoard(g, d);
      if (g.group_by === "region" && !routed) { routed = true; sec.insertBefore(renderRouteLine(d), sec.firstChild); }
      boards.appendChild(sec); order.push([g.id, g.title || g.id]);
      if (g.id === "regions") {
        var dg = buildDrivers(d, w);
        if (dg) { boards.appendChild(renderBoard(dg, d)); order.push([dg.id, dg.title]); }
      }
    });
    var ind = d.indicators && renderIndicators(d.indicators);
    if (ind) { boards.appendChild(ind); order.push(["indicators", "Indicators"]); }
    var spr = renderSpreads(d.spreads);
    if (spr) { boards.appendChild(spr); order.push(["spreads", "Spreads"]); }
    [ind, spr].forEach(function (x) { if (x) filterHooks.push(function (st) { x.hidden = !!st.q; return 0; }); });
    if (d.headlines && d.headlines.length) order.push(["headlines", "Headlines"]);
    if (d.reading && d.reading.length) order.push(["reading", "Reading"]);
    if (d.climate && d.climate.length) order.push(["climate", "Climate"]);
    renderPaper(d, w);
    function openBoard(id) { var t = $(id); if (t && t._setOpen && isPhone() && t.classList.contains("collapsed")) t._setOpen(true, true); }
    var NAVG = [["Alerts", ["alerts"]], ["Movers", ["movers"]], ["Markets", ["macros", "core_passive", "funds_401k"]], ["Tech", ["semis", "mega_tech"]],
      ["Energy", ["energy", "nuclear", "carbon", "startups"]], ["Materials", ["metals", "chemicals", "agriculture", "shipping"]],
      ["Regions", ["regions", "region_drivers", "policy_rates", "currencies"]], ["Themes", ["esg_funds", "themes", "positive_impact"]],
      ["Data", ["indicators", "spreads"]], ["Read", ["headlines", "reading", "climate"]]];
    var label = {}; order.forEach(function (o) { label[o[0]] = o[1]; });
    var mapped = {}; NAVG.forEach(function (g) { g[1].forEach(function (id) { mapped[id] = 1; }); });
    var extra = order.filter(function (o) { return !mapped[o[0]]; }).map(function (o) { return o[0]; });
    if (extra.length) NAVG.splice(NAVG.length - 1, 0, ["More", extra]);
    var navGroups = NAVG.map(function (g) { return { name: g[0], ids: g[1].filter(function (id) { return label[id]; }) }; }).filter(function (g) { return g.ids.length; });
    var gOf = {}; navGroups.forEach(function (g, i) { g.ids.forEach(function (id) { gOf[id] = i; }); });
    var subrow = $("tabsub"), gLinks = [], curG = -1, curId = "";
    navGroups.forEach(function (g, i) {
      var a = el("a", null, g.name); a.href = "#" + g.ids[0];
      a.addEventListener("click", function () { openBoard(g.ids[0]); });
      gLinks.push(a); tabs.appendChild(a);
    });
    function paintNav(id) {
      var gi = gOf[id]; if (gi == null) return;
      if (gi !== curG) {
        curG = gi;
        gLinks.forEach(function (a, i) { a.classList.toggle("on", i === gi); });
        subrow.textContent = "";
        if (navGroups[gi].ids.length > 1) navGroups[gi].ids.forEach(function (bid) {
          var a = el("a", null, label[bid]); a.href = "#" + bid; a.dataset.t = bid;
          a.addEventListener("click", function () { openBoard(bid); });
          subrow.appendChild(a);
        });
      }
      Array.prototype.forEach.call(subrow.children, function (a) { a.classList.toggle("on", a.dataset.t === id); });
    }
    paintNav(order[0][0]);
    if (location.hash) openBoard(location.hash.slice(1));
    var all = Array.prototype.filter.call(boards.querySelectorAll("section.board"), function (b) { return b._setOpen; });
    if (all.length) {
      var ctl = el("button", "ball"); ctl.type = "button";
      var sync = function () { ctl.textContent = all.some(function (b) { return b.classList.contains("collapsed"); }) ? "open all boards" : "close all boards"; };
      ctl.addEventListener("click", function () { var open = all.some(function (b) { return b.classList.contains("collapsed"); }); all.forEach(function (b) { b._setOpen(open, true); }); sync(); });
      all.forEach(function (b) { b.addEventListener("toggled", sync); });
      sync();
      var first = all[0]; first.parentNode.insertBefore(ctl, first);
    }
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) paintNav(e.target.id); });
      }, { rootMargin: "-45% 0px -50% 0px" });
      order.forEach(function (o) { var t = $(o[0]); if (t) io.observe(t); });
    }
    try { localStorage.setItem("board-seen", JSON.stringify(nextSeen)); } catch (e) {}
  }

  Promise.all([
    fetch("data/latest.json?ts=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }),
    fetch("data/watchlist.json?ts=" + Date.now()).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
  ]).then(function (res) { init(res[0], res[1]); }).catch(function () {
    $("stamp").textContent = "could not load the latest brief";
  });
})();
</script>
</body>
